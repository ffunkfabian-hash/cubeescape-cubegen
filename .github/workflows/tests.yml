name: tests

# Pure logic in GitHub; Blender, images and golden hashes run on the Mac through check.nightly.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**", "app/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", ".claude/**", ".agents/**", "app/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: quick (3.11)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ce-repo.json
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends imagemagick
      - name: check.quick aus .ce-repo.json
        run: ./ce check
