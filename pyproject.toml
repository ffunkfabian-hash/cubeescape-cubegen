[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cubegen"
version = "0.4.0"
description = "Seeded low-poly asset generator for Cube Escape (Blender CLI + ImageMagick, FBX for Unity)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cubegen = "cubegen.cli:main"

[tool.setuptools.packages.find]
include = ["cubegen*"]
