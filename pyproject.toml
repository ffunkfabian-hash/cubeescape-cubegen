[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cubegen"
version = "0.20.0"
description = "Seeded low-poly asset generator for Cube Escape (Blender CLI + ImageMagick, FBX for Unity)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cubegen = "cubegen.cli:main"

[project.gui-scripts]
cubegen-gui = "cubegen.gui:main"

[tool.setuptools.packages.find]
include = ["cubegen*"]

[tool.setuptools.package-data]
cubegen = ["family_data/*.json", "contract.json"]
